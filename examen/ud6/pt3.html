<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Drag and drop</title>
    <style>
        .capa {
            width: 200px;
            height: 100px;
            border: 1px solid black;
            margin: 10px;
        }
        #origen {
            background-color: yellow;
        }
        #destino {
            background-color: white;
        }
    </style>
</head>
<body>
    <div id="origen" class="capa" draggable="true">Soy arrastrable</div>
    <div id="destino" class="capa">Soy el destino</div>
    <script src="pt3.js"></script>
</body>
</html>
